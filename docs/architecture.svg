<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture map of the ShopLedger browser UI, Express server, API routers, library modules, configuration, JSON database, and the numbered order placement flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#55708d"/></marker>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#14263d}
      .title{font-size:34px;font-weight:750}.subtitle{font-size:16px;fill:#52667e}
      .zone{fill:#f7f9fc;stroke:#cbd5e1;stroke-width:2;rx:18}
      .zoneTitle{font-size:18px;font-weight:700;letter-spacing:.7px;fill:#52667e}
      .box{fill:#fff;stroke:#9aacc0;stroke-width:1.5;rx:12}
      .file{font-size:17px;font-weight:700}.detail{font-size:13px;fill:#52667e}
      .router{fill:#f0fdfa;stroke:#5aa99c}.lib{fill:#f5f3ff;stroke:#9b8ac7}
      .data{fill:#fff7ed;stroke:#dd9b55}.ui{fill:#eff6ff;stroke:#6a9bd2}
      .server{fill:#eef2ff;stroke:#7b87c7}.config{fill:#fff1f2;stroke:#ce8191}
      .arrow{fill:none;stroke:#55708d;stroke-width:2;marker-end:url(#arrow)}
      .flow{fill:none;stroke:#0e7490;stroke-width:4;marker-end:url(#flowArrow)}
      .flowLabel{font-size:13px;font-weight:750;fill:#0e7490}
      .num{fill:#0e7490;stroke:#fff;stroke-width:2}.numText{font-size:14px;font-weight:800;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .legend{font-size:14px;fill:#52667e}
    </style>
  </defs>
  <rect width="1800" height="1280" fill="#fff"/>
  <text x="58" y="62" class="title">ShopLedger — application architecture</text>
  <text x="60" y="91" class="subtitle">Browser POS and business views · Express API · JSON file persistence</text>

  <!-- UI -->
  <rect x="55" y="125" width="370" height="325" class="zone"/>
  <text x="78" y="160" class="zoneTitle">BROWSER UI · public/</text>
  <rect x="82" y="186" width="315" height="76" class="box ui"/>
  <text x="103" y="216" class="file">index.html</text><text x="103" y="240" class="detail">POS, Orders, Khata, Audit views</text>
  <rect x="82" y="282" width="315" height="76" class="box ui"/>
  <text x="103" y="312" class="file">js/app.js</text><text x="103" y="336" class="detail">XHR calls · cart and screen updates</text>
  <rect x="82" y="378" width="315" height="48" class="box ui"/>
  <text x="103" y="408" class="file">css/style.css</text>
  <path d="M239 262 V278" class="arrow"/>

  <!-- Server -->
  <rect x="485" y="125" width="335" height="325" class="zone"/>
  <text x="508" y="160" class="zoneTitle">HTTP SERVER</text>
  <rect x="515" y="205" width="275" height="145" class="box server"/>
  <text x="540" y="240" class="file">server.js</text>
  <text x="540" y="269" class="detail">Express app · bodyParser.json()</text>
  <text x="540" y="293" class="detail">serves public/ · mounts routers at /api</text>
  <text x="540" y="317" class="detail">GET /orders/:id/invoice</text>

  <!-- Routes -->
  <rect x="875" y="125" width="410" height="505" class="zone"/>
  <text x="898" y="160" class="zoneTitle">API ROUTERS · routes/</text>
  <rect x="905" y="185" width="350" height="78" class="box router"/>
  <text x="928" y="216" class="file">orders.js</text><text x="928" y="240" class="detail">GET/POST /orders · cancel order</text>
  <rect x="905" y="278" width="350" height="72" class="box router"/>
  <text x="928" y="308" class="file">products.js</text><text x="928" y="331" class="detail">GET /products · GET /coupons</text>
  <rect x="905" y="365" width="350" height="72" class="box router"/>
  <text x="928" y="395" class="file">customers.js</text><text x="928" y="418" class="detail">GET /customers · POST settlement</text>
  <rect x="905" y="452" width="350" height="112" class="box router"/>
  <text x="928" y="483" class="file">reports.js</text><text x="928" y="507" class="detail">dashboard · GST reconciliation</text><text x="928" y="531" class="detail">pricing preview · admin export</text>
  <text x="905" y="600" class="detail">Invoice route is registered directly in server.js.</text>

  <!-- Lib -->
  <rect x="1340" y="125" width="405" height="790" class="zone"/>
  <text x="1363" y="160" class="zoneTitle">BUSINESS LOGIC · lib/</text>
  <rect x="1370" y="184" width="345" height="70" class="box lib"/><text x="1390" y="214" class="file">orders.js</text><text x="1390" y="237" class="detail">create · get · list · cancel</text>
  <rect x="1370" y="267" width="345" height="70" class="box lib"/><text x="1390" y="297" class="file">inventory.js</text><text x="1390" y="320" class="detail">stock check · deduct · release · summary</text>
  <rect x="1370" y="350" width="345" height="70" class="box lib"/><text x="1390" y="380" class="file">pricing.js</text><text x="1390" y="403" class="detail">subtotal · coupon discount · tax totals</text>
  <rect x="1370" y="433" width="345" height="70" class="box lib"/><text x="1390" y="463" class="file">coupons.js</text><text x="1390" y="486" class="detail">normalize · validate · calculate</text>
  <rect x="1370" y="516" width="345" height="70" class="box lib"/><text x="1390" y="546" class="file">tax.js</text><text x="1390" y="569" class="detail">HSN GST rate · CGST/SGST split</text>
  <rect x="1370" y="599" width="345" height="70" class="box lib"/><text x="1390" y="629" class="file">ledger.js</text><text x="1390" y="652" class="detail">Khata credit · customer settlements</text>
  <rect x="1370" y="682" width="345" height="70" class="box lib"/><text x="1390" y="712" class="file">reports.js</text><text x="1390" y="735" class="detail">dashboard · reconciliation</text>
  <rect x="1370" y="765" width="345" height="70" class="box lib"/><text x="1390" y="795" class="file">invoice.js</text><text x="1390" y="818" class="detail">invoice figures · printable HTML</text>
  <rect x="1370" y="848" width="345" height="48" class="box lib"/><text x="1390" y="878" class="file">dates.js</text>

  <!-- Config and DB -->
  <rect x="485" y="520" width="335" height="125" class="box config"/>
  <text x="510" y="554" class="file">config.js</text>
  <text x="510" y="580" class="detail">port · shop details · GST slabs</text>
  <text x="510" y="604" class="detail">inventory defaults · coupons · admin key</text>
  <rect x="875" y="760" width="410" height="150" class="box data"/>
  <text x="905" y="797" class="file">data/db.json</text>
  <text x="905" y="827" class="detail">products · customers · orders · settlements</text>
  <text x="905" y="851" class="detail">next IDs · audit log</text>
  <rect x="485" y="720" width="335" height="105" class="box lib"/>
  <text x="510" y="758" class="file">lib/store.js</text>
  <text x="510" y="785" class="detail">read · write · append audit</text>

  <!-- architecture edges -->
  <path d="M425 300 H485" class="arrow"/>
  <text x="434" y="288" class="detail">HTTP</text>
  <path d="M820 270 H875" class="arrow"/>
  <text x="827" y="258" class="detail">/api</text>
  <path d="M690 450 V520" class="arrow"/>
  <text x="700" y="489" class="detail">loads</text>
  <path d="M690 645 V720" class="arrow"/>
  <path d="M820 772 H875" class="arrow"/>
  <path d="M1255 225 H1340" class="arrow"/>
  <path d="M1255 403 H1340" class="arrow"/>
  <path d="M1255 506 H1340" class="arrow"/>
  <path d="M1340 806 H1295 V835 H1285" class="arrow"/>
  <path d="M1370 219 H1320 V721 H820" class="arrow"/>
  <text x="1215" y="708" class="detail">store.read/write</text>
  <path d="M1370 385 H1327 V795 H1285" class="arrow"/>
  <path d="M1370 468 H1315 V585 H1285" class="arrow"/>
  <path d="M1370 551 H1307 V550 H1285" class="arrow"/>
  <path d="M1370 634 H1297 V615 H1285" class="arrow"/>
  <path d="M1370 717 H1290 V506 H1285" class="arrow"/>
  <path d="M1370 800 H1300 V600 H1285" class="arrow"/>

  <!-- highlighted order path, deliberately overlaid and numbered -->
  <path d="M394 322 H472 V388 H890 V224 H905" class="flow"/>
  <circle cx="455" cy="322" r="15" class="num"/><text x="455" y="322" class="numText">1</text>
  <text x="515" y="379" class="flowLabel">POST /api/orders</text>
  <path d="M1080 263 V275" class="flow"/>
  <circle cx="1080" cy="270" r="15" class="num"/><text x="1080" y="270" class="numText">2</text>
  <path d="M1255 224 H1360 V302 H1370" class="flow"/>
  <circle cx="1328" cy="302" r="15" class="num"/><text x="1328" y="302" class="numText">3</text>
  <path d="M1542 254 V349" class="flow"/><circle cx="1542" cy="300" r="15" class="num"/><text x="1542" y="300" class="numText">4</text>
  <path d="M1715 219 H1730 V940 H1070 V910" class="flow"/>
  <circle cx="1730" cy="895" r="15" class="num"/><text x="1730" y="895" class="numText">5</text>
  <path d="M875 837 H835 V772 H820" class="flow"/>
  <circle cx="850" cy="837" r="15" class="num"/><text x="850" y="837" class="numText">6</text>
  <path d="M690 720 V650 H820 V449 H485" class="flow"/>
  <circle cx="690" cy="675" r="15" class="num"/><text x="690" y="675" class="numText">7</text>
  <text x="55" y="1000" class="zoneTitle">ORDER PLACEMENT FLOW</text>
  <g transform="translate(55 1020)">
    <rect x="0" y="0" width="1690" height="190" rx="16" fill="#f0fdfa" stroke="#83c8be" stroke-width="1.5"/>
    <g font-size="15">
      <circle cx="38" cy="43" r="15" class="num"/><text x="38" y="43" class="numText">1</text><text x="66" y="39" font-weight="700">UI sends cart</text><text x="66" y="62" class="detail">js/app.js posts item IDs, quantities and order choices</text>
      <circle cx="465" cy="43" r="15" class="num"/><text x="465" y="43" class="numText">2</text><text x="493" y="39" font-weight="700">Router resolves products</text><text x="493" y="62" class="detail">routes/orders.js reads current product records</text>
      <circle cx="900" cy="43" r="15" class="num"/><text x="900" y="43" class="numText">3</text><text x="928" y="39" font-weight="700">Check and calculate</text><text x="928" y="62" class="detail">inventory + coupons + pricing + tax</text>
      <circle cx="1320" cy="43" r="15" class="num"/><text x="1320" y="43" class="numText">4</text><text x="1348" y="39" font-weight="700">Apply Khata when selected</text><text x="1348" y="62" class="detail">ledger checks credit and adds billed amount</text>
      <circle cx="38" cy="123" r="15" class="num"/><text x="38" y="123" class="numText">5</text><text x="66" y="119" font-weight="700">Update in memory</text><text x="66" y="142" class="detail">deduct stock · create order · append audit entry</text>
      <circle cx="465" cy="123" r="15" class="num"/><text x="465" y="123" class="numText">6</text><text x="493" y="119" font-weight="700">Persist JSON</text><text x="493" y="142" class="detail">lib/store.js writes data/db.json</text>
      <circle cx="900" cy="123" r="15" class="num"/><text x="900" y="123" class="numText">7</text><text x="928" y="119" font-weight="700">Return order</text><text x="928" y="142" class="detail">201 response; UI refreshes products, dashboard and customers</text>
    </g>
  </g>
  <rect x="55" y="1230" width="16" height="16" rx="4" fill="#0e7490"/><text x="80" y="1244" class="legend">Numbered teal arrows and markers show the order placement path</text>
  <line x1="610" y1="1238" x2="655" y2="1238" class="arrow"/><text x="668" y="1244" class="legend">Other code relationships</text>
</svg>
